tag: v0.1.3
title: Oneshot services and dependency readiness

features:
  - "New `oneshot = true` service option for one-time jobs such as migrations and init scripts"
  - "Dependent services now wait for oneshot dependencies to complete successfully"

fixes:
  - "Dependency waiting detects failed dependencies and aborts dependents early"

changes:
  - "`oneshot` services must use `restart = never` (or omit restart)"
  - "Added tests for oneshot parsing, dependency failure handling and restart-policy validation"
  - "Updated examples and configuration docs with oneshot usage patterns"
